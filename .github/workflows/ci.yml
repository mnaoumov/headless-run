name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quoting playground model tests
        run: node --test docs/src/quoting-models/quoting.test.ts
      # Builds the documentation site and checks every link in it; the deployment is build-pages.yml.
      - name: Build documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run docs:build
  test:
    runs-on: windows-latest
    env:
      DOTNET_PROCESSOR_COUNT: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The quoting playground's models are TypeScript, which test.ps1 runs with this Node.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build and integration test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Publish NativeAOT
        shell: pwsh
        run: dotnet publish src/headless-run -c Release -r win-x64 -p:PublishAot=true -o artifacts/win-x64 -m:2
      - name: Test native executable
        shell: pwsh
        run: ./scripts/test.ps1 -Launcher ./artifacts/win-x64/headless-run.exe
      - name: Publish NativeAOT x86
        shell: pwsh
        run: dotnet publish src/headless-run -c Release -r win-x86 -p:PublishAot=true -o artifacts/win-x86 -m:2
      - name: Test native x86 executable
        shell: pwsh
        run: ./scripts/test.ps1 -Launcher ./artifacts/win-x86/headless-run.exe
