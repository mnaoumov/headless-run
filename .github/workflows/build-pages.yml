name: Build GitHub Pages

# Builds the Astro + Starlight documentation site and deploys it to GitHub Pages. Requires Pages to be enabled with
# "GitHub Actions" as the source (repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions).

on:
  # release.yml dispatches this workflow on `main` once it has published a release. A `release` trigger would never
  # fire: GitHub starts no workflow from an event made with GITHUB_TOKEN, except workflow_dispatch. It also runs on
  # `main`, the branch the github-pages environment allows to deploy, rather than on the release tag.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Open Graph cards are slow to produce; their content-hash manifest reuses unchanged ones.
      - name: Restore generated docs cache
        uses: actions/cache@v6
        with:
          path: docs/public/og
          key: docs-og-${{ hashFiles('docs/src/content/docs/**/*.md', 'docs/src/content/docs/**/*.mdx', 'astro.config.ts', 'docs/public/favicon.svg', 'package-lock.json') }}
          restore-keys: |
            docs-og-

      # The token lets the build read the repository's homepage and report one that is not the site's URL.
      - name: Build documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
