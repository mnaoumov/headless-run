name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-x86
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOTNET_PROCESSOR_COUNT: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify tag and source version
        shell: pwsh
        run: |
          [xml] $project = Get-Content src/headless-run/headless-run.csproj
          if ($env:GITHUB_REF_NAME -ne "v$($project.Project.PropertyGroup.Version)") { throw 'Tag and project version differ' }
      - name: Publish NativeAOT
        shell: pwsh
        run: dotnet publish src/headless-run -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/${{ matrix.rid }} -m:2
      - name: Integration test native release
        shell: pwsh
        run: ./scripts/test.ps1 -Launcher ./artifacts/${{ matrix.rid }}/headless-run.exe
      - name: Package executable and checksum
        shell: pwsh
        run: |
          $name = 'headless-run-${{ matrix.rid }}.exe'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item artifacts/${{ matrix.rid }}/headless-run.exe release/$name
          $hash = (Get-FileHash release/$name -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/release/$name.sha256", "$hash  $name`n")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: release/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($line) $line -match "^## $([regex]::Escape($version))( |$)" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($line) $line -match '^## ' })
          if ($end -lt 0) { $end = $lines.Length }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          if (-not $notes) { throw "The CHANGELOG.md section for $version is empty" }
          [IO.File]::WriteAllText("$PWD/release-notes.md", ($notes -replace '(?m)^###', '##') + "`n")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes
